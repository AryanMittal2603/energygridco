<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRIDCO Power Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: working operations software. White top bar and side nav, flat bordered panels on a pale grey canvas, one blue accent, colour reserved for meaning. Light-only. */
:root{
  color-scheme:light;
  --bg:#F3F4F6; --panel:#FFFFFF; --sub:#F8F9FA; --ink:#14171C; --ink2:#394150; --muted:#6B7280; --faint:#9CA3AF; --line:#E1E4E8; --line2:#EDEFF2;
  --accent:#1E4FD8; --accent-d:#173FAF; --accent-soft:#EEF3FF;
  --bad:#B42318; --bad-bg:#FEF3F2; --warn:#B54708; --warn-bg:#FFF8EB; --good:#067647; --good-bg:#ECFDF3;
  --supply:#CBD1DA; --supply-l:#8C96A5; --surplus:#D9F0E1;
  --o-otc:#1E4FD8; --o-bank:#6E56CF; --o-dam:#E07B24; --o-rtm:#C4421A; --o-dr:#0E8A7E; --o-peak:#B83280;
  --f:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:20px} h2{font-size:14px} h3{font-size:13px}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--fm);font-size:12.5px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.neg{color:var(--bad)} .pos{color:var(--good)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* top bar */
.top{height:48px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.logo{display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:4px;background:var(--ink);display:grid;place-items:center}
.logo b{font-weight:600}
.logo span{color:var(--muted)}
.gsearch{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:32px;background:var(--sub);color:var(--muted)}
.gsearch input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.gsearch kbd{font-family:var(--fm);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:#fff}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.env{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--warn);border:1px solid #F5D9A8;background:var(--warn-bg);border-radius:4px;padding:1px 6px}
.clock{color:var(--muted);font-variant-numeric:tabular-nums}
.user{display:flex;align-items:center;gap:8px}
.user .av{width:26px;height:26px;border-radius:50%;background:var(--ink2);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.user select{border:0;background:transparent;font-weight:500;cursor:pointer;max-width:230px}

.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100% - 48px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto;display:flex;flex-direction:column}
.side button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;color:var(--ink2);font-weight:500}
.side button:hover{background:var(--sub)}
.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side button:focus-visible{outline:2px solid var(--accent)}
.side svg{flex:none;color:var(--faint)}
.side button[aria-current="page"] svg{color:var(--accent)}
.side .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.side .cnt.hot{color:var(--bad)}
.side .sep{height:1px;background:var(--line2);margin:8px 6px}
.side-foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--muted);display:grid;gap:6px}
.side-foot button{all:unset;cursor:pointer;color:var(--accent);font-size:12px;padding:0}

.main{min-width:0}
.content{padding:18px 22px 48px;display:flex;flex-direction:column;gap:14px;min-width:0;max-width:1400px}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs button{all:unset;cursor:pointer;color:var(--accent)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.phead .sub{color:var(--muted);margin-top:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2);min-height:44px}
.ph .note{color:var(--muted);font-size:12px}
.pb{padding:14px}
.pb.flush{padding:0}
.cols{display:grid;gap:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c12{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:6px}
.stat{padding:12px 16px;border-left:1px solid var(--line2);min-width:0}
.stat:first-child{border-left:0}
.stat-l{font-size:12px;color:var(--muted)}
.stat-v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.stat-v small{font-size:13px;font-weight:500;color:var(--muted)}
.stat-c{font-size:12px;color:var(--muted);margin-top:1px}
button.stat{all:unset;box-sizing:border-box;padding:12px 16px;border-left:1px solid var(--line2);cursor:pointer;min-width:0}
button.stat:first-child{border-left:0}
button.stat:hover{background:var(--sub)}

/* status text */
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.st.bad::before{background:var(--bad)} .st.warn::before{background:#E09A2C} .st.good::before{background:#2E9E62} .st.info::before{background:var(--accent)}
.tag{font-family:var(--fm);font-size:11px;color:var(--ink2);background:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap}
.flag{font-size:11.5px;font-weight:600;border-radius:3px;padding:1px 6px;white-space:nowrap}
.flag.bad{background:var(--bad-bg);color:var(--bad)} .flag.warn{background:var(--warn-bg);color:var(--warn)} .flag.good{background:var(--good-bg);color:var(--good)} .flag.info{background:var(--accent-soft);color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:5px;cursor:pointer;font-weight:500;white-space:nowrap;color:var(--ink2)}
.btn:hover{background:var(--sub);border-color:#CDD2D9}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.dng{color:var(--bad)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:12.5px;color:var(--ink2);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 0;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sub)}
td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:#F6F8FB}
tr.on td{background:var(--accent-soft)}
td .s2{display:block;font-size:12px;color:var(--muted)}
tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--sub)}
td.id{font-family:var(--fm);font-size:12.5px;white-space:nowrap}

.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border-top:1px solid var(--line2)}
.facts div{padding:10px 14px;border-left:1px solid var(--line2)}
.facts div:first-child{border-left:0}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts b{font-weight:600;font-variant-numeric:tabular-nums}
.callout{border-left:3px solid var(--line);background:var(--sub);padding:9px 12px;font-size:13px;border-radius:0 4px 4px 0}
.callout.bad{border-color:var(--bad);background:var(--bad-bg)} .callout.warn{border-color:#E09A2C;background:var(--warn-bg)} .callout.good{border-color:#2E9E62;background:var(--good-bg)} .callout.info{border-color:var(--accent);background:var(--accent-soft)}
.ref{all:unset;cursor:pointer;font-family:var(--fm);font-size:11.5px;color:var(--accent);margin-right:8px;white-space:nowrap}
.ref:hover{text-decoration:underline}
.lbl{display:grid;gap:4px;font-size:12px;color:var(--muted)}
textarea,input[type=search],input[type=date],select.in,input.in{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 9px;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
textarea:focus,input.in:focus,input[type=search]:focus,input[type=date]:focus,select.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ctl input[type=range]{width:110px;accent-color:var(--accent)}
.ctl output{font-variant-numeric:tabular-nums;min-width:38px;font-weight:600}
.ctl input[type=checkbox]{accent-color:var(--accent)}
.empty{padding:22px;color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}

/* charts */
svg text{font-family:var(--f);font-size:11px;fill:var(--muted)}
.chart{width:100%;height:auto;display:block}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(30,79,216,.06)}
.hit.on{fill:rgba(30,79,216,.09)}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;border-radius:4px;padding:7px 9px;font-size:12px;line-height:1.5;white-space:pre-line;max-width:300px;opacity:0;left:0;top:0;font-variant-numeric:tabular-nums}
#tip.on{opacity:1}

/* list rows */
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.act:last-child{border-bottom:0}
.act:hover{background:#F6F8FB}
.act .who{font-size:12px;color:var(--muted)}
.act .amt{font-variant-numeric:tabular-nums;text-align:right;font-weight:500;white-space:nowrap}

/* document viewer */
.docv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.paper{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.06);padding:20px;font-size:11.5px;color:#262B33;position:relative}
.paper .lh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid #262B33;padding-bottom:8px;margin-bottom:10px}
.paper table{font-size:11px} .paper th{background:#F2F3F5;color:#4B5260} .paper td{padding:5px 8px}
.paper .wm{position:absolute;right:16px;bottom:12px;color:#C4C8CF;font-size:10px;letter-spacing:.12em;font-weight:600}
.fx{background:rgba(224,154,44,.18);outline:1px solid rgba(224,154,44,.55)}
.fx.badfx{background:rgba(180,35,24,.10);outline-color:rgba(180,35,24,.55)}
.fx.hi{background:rgba(30,79,216,.15);outline:2px solid var(--accent)}
.xf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:7px 10px;border-bottom:1px solid var(--line2)}
.xf:hover{background:var(--accent-soft)}
.xf .k{font-size:12px;color:var(--muted)} .xf .v{font-weight:500} .xf .c{font-family:var(--fm);font-size:11px;color:var(--faint)} .xf .r{grid-column:1/-1;font-size:12px}

/* lineage */
.linw{overflow-x:auto}
.lin{min-width:960px;width:100%;height:auto;display:block}
.lin .e{fill:none;stroke:#C9CED6;stroke-width:1.3}
.lin .e.hot{stroke:var(--accent);stroke-width:2}
.lin .e.dim{opacity:.25}
.lin .e.err{stroke:var(--bad);stroke-dasharray:4 4}
.lin .n{cursor:pointer}
.lin .n rect{fill:#fff;stroke:#D5D9DF}
.lin .n:hover rect{stroke:#9AA3AF}
.lin .n.on rect{stroke:var(--accent);stroke-width:2}
.lin .n.dim{opacity:.35}
.lin .n text{fill:var(--ink)}
.lin .n .t1{font-size:12.5px;font-weight:500}
.lin .n .t2{font-size:11px;fill:var(--muted)}
.lin .colh{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.06em}

/* assistant */
.chatw{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:stretch}
.conv{display:grid;grid-template-rows:minmax(0,1fr) auto;height:calc(100vh - 178px);min-height:520px}
.msgs{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.m-q{align-self:flex-end;background:var(--sub);border:1px solid var(--line);border-radius:6px;padding:7px 11px;max-width:80%}
.m-a{display:grid;gap:8px;padding-left:12px;border-left:2px solid var(--line);cursor:pointer}
.m-a.on{border-left-color:var(--accent)}
.m-a .hd{font-size:12px;color:var(--muted)}
.m-a .hd b{color:var(--ink);font-weight:600}
.m-a table{font-size:12.5px;border:1px solid var(--line2)}
.steps{font-family:var(--fm);font-size:11px;color:var(--faint)}
.composer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0}
.sugg{display:flex;flex-direction:column}
.sugg button{all:unset;cursor:pointer;padding:7px 14px;border-bottom:1px solid var(--line2);color:var(--ink2)}
.sugg button:hover{background:var(--sub);color:var(--accent)}
.ev{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ev .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.ev blockquote{margin:0;padding:6px 10px;border-left:2px solid var(--accent);background:var(--accent-soft);font-size:13px}

/* modal, toast */
.mbg{position:fixed;inset:0;background:rgba(20,23,28,.4);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:6px;max-width:720px;width:100%;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line)}
.pipe{display:grid}
.pstep{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line2);color:var(--faint)}
.pstep.on{color:var(--ink)}
.pstep .d{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;margin-top:1px}
.pstep.on .d{background:var(--good);border-color:var(--good);color:#fff}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:5px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1180px){.c21,.c12,.chatw,.docv{grid-template-columns:minmax(0,1fr)}.conv{height:auto;max-height:none}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}
  .side button{width:auto;white-space:nowrap}
  .side .sep,.side-foot{display:none}
  .top{position:static;flex-wrap:wrap;height:auto;padding:8px 16px}
  .gsearch{order:3;max-width:none;flex-basis:100%}
  .c2{grid-template-columns:minmax(0,1fr)}
  .stat{border-left:0;border-top:1px solid var(--line2)}
}
@media (max-width:560px){
  .content{padding:14px 16px 40px}
  .logo span,.clock{display:none}
  .top-r{gap:8px}
  .user select{max-width:150px}
}

/* polish */
:root{--bg:#F5F6F8;--line:#E4E7EB;--line2:#EFF1F4}
body{font-size:14px}
.content{padding:22px 28px 64px;gap:16px}
.panel,.stats,.guide{border-radius:8px}
.ph{padding:12px 18px}
.pb{padding:16px 18px}
.stat,button.stat{padding:14px 18px}
.stat-v{font-size:22px}
th{padding:8px 14px} td{padding:10px 14px}
.shell{grid-template-columns:232px minmax(0,1fr)}
.side{padding:14px 10px}
.side button{align-items:flex-start;padding:8px 10px;gap:11px}
.side svg{margin-top:2px}
.side .nl{display:grid;gap:1px;min-width:0}
.side .nd{font-size:11.5px;color:var(--faint);font-weight:400;line-height:1.3}
.side button[aria-current="page"] .nd{color:#7C93D6}
/* page guide */
.guide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px 24px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px 18px}
.guide .what{color:var(--ink2);line-height:1.5}
.guide .what b{color:var(--ink);font-weight:600}
.try{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.try>span{font-size:12px;color:var(--muted);margin-right:2px}
.chip{all:unset;cursor:pointer;font-size:12.5px;border:1px solid var(--line);border-radius:14px;padding:3px 11px;background:var(--sub);color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip.go{background:var(--accent);border-color:var(--accent);color:#fff}
.insight{font-size:13px;color:var(--ink2);margin:0 0 12px;line-height:1.5}
.insight b{color:var(--ink);font-weight:600}
abbr.term{text-decoration:underline dotted #9CA3AF;text-underline-offset:3px;cursor:help}
/* demo guide drawer */
.gbtn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid #C7D4F7;color:var(--accent);background:var(--accent-soft);border-radius:5px;font-weight:500;cursor:pointer;white-space:nowrap}
.gbtn b{font-weight:600;font-variant-numeric:tabular-nums}
.gbtn:hover{border-color:var(--accent)}
.drawer{position:fixed;top:48px;right:0;bottom:0;width:384px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(20,23,28,.08);z-index:40;display:flex;flex-direction:column}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line2)}
.prog{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--good)}
.dsteps{overflow:auto;flex:1}
.dstep{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line2);align-items:start}
.dstep .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid #CDD2D9;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:600}
.dstep.done .ck{background:var(--good);border-color:var(--good)}
.dstep.next{background:#F7F9FF}
.dstep .m{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.dstep .t{font-weight:500}
.dstep.done .t{color:var(--muted)}
.dstep .h{font-size:12.5px;color:var(--muted);margin-top:2px}
.dfoot{padding:12px 18px;border-top:1px solid var(--line2);display:grid;gap:8px}
.gloss{max-height:220px;overflow:auto;font-size:12.5px}
.gloss div{padding:4px 0;border-bottom:1px solid var(--line2)}
.gloss b{display:inline-block;min-width:54px;font-weight:600}

   ========================================================= */
function epmRun(sc){
  const dem = DEMAND.map(d=>Math.round(d*(1+sc.demand/100)));
  const sup = {
    thermal: H24.map(()=>2400 + (sc.outage?594:1188) + 440 + 150),
    hydro: HYDRO.map(v=>Math.round(v*sc.hydro/100)),
    solar: SOLARF.map(f=>Math.round(1200*f)),
    wind: WINDF.map(f=>Math.round(350*f)),
  };
  const avail = H24.map(h=>sup.thermal[h]+sup.hydro[h]+sup.solar[h]+sup.wind[h]);
  const dam = DAMP.map(p=>+(p*(1+sc.price/100)).toFixed(2));
  const OPTS = [
    {id:'otc', name:'OTC peak block (bilateral, 17–23 h)', short:'OTC block', price:()=>6.20, lim:500, hrs:[17,18,19,20,21,22], imp:true, color:'--c-otc'},
    {id:'bank', name:'Banking return from partner state', short:'Banking', price:()=>3.40, lim:250, hrs:[18,19,20,21], imp:true, color:'--c-bank'},
    {id:'dam', name:'Day-ahead market purchase', short:'Exchange DAM', price:h=>dam[h], lim:800, imp:true, color:'--c-dam'},
    {id:'rtm', name:'Real-time market (risk-adjusted)', short:'Exchange RTM', price:h=>+(dam[h]*1.04).toFixed(2), lim:300, imp:true, color:'--c-rtm'},
    {id:'dr', name:'Industrial demand response', short:'Demand response', price:()=>7.00, lim:150, imp:false, color:'--c-dr'},
    {id:'peak', name:'Standby gas unit (in-state)', short:'Standby gas', price:()=>8.40, lim:200, imp:false, color:'--c-peak'},
  ];
  function dispatch(otcMW, allow){
    const rows = H24.map(h=>{
      let need = dem[h]-avail[h], imp=0, cost=0, alloc={}, binding=false;
      const o = OPTS[0];
      if(allow.otc && o.hrs.includes(h) && otcMW>0){ alloc.otc=otcMW; imp+=otcMW; cost+=otcMW*o.price(h)/1e4; need-=otcMW; }
      const rest = OPTS.slice(1).filter(x=>allow[x.id] && (!x.hrs||x.hrs.includes(h))).sort((a,b)=>a.price(h)-b.price(h));
      for(const x of rest){ if(need<=0) break; let cap=Math.min(x.lim, need); if(x.imp){ const room=ATC-imp; if(room<cap){ cap=Math.max(0,room); binding=true; } } if(cap<=0) continue; alloc[x.id]=cap; if(x.imp) imp+=cap; cost+=cap*x.price(h)/1e4; need-=cap; }
      const unmet=Math.max(0,need); let sold=0, rev=0;
      if(need<0 && sc.sell){ sold=Math.min(-need, EXPORT_LIM); rev=sold*dam[h]*0.97/1e4; }
      return {h, dem:dem[h], avail:avail[h], gap:dem[h]-avail[h], alloc, cost, unmet, sold, rev, binding, imp};
    });
    const cost=rows.reduce((a,r)=>a+r.cost,0), rev=rows.reduce((a,r)=>a+r.rev,0), unmet=rows.reduce((a,r)=>a+r.unmet,0);
    return {rows, cost, rev, unmet, net:cost-rev, obj:cost-rev+unmet*VOLL/1e4};
  }
  const all={otc:1,bank:1,dam:1,rtm:1,dr:1,peak:1};
  let best=null;
  for(let m=0;m<=500;m+=50){ const r=dispatch(m,all); r.otcMW=m; if(!best||r.obj<best.obj-1e-9) best=r; }
  const base=dispatch(0,{dam:1,rtm:1,dr:1,peak:1}); base.otcMW=0;
  const byOpt = OPTS.map(o=>{ let mwh=0,c=0,peak=0; best.rows.forEach(r=>{ const v=r.alloc[o.id]||0; mwh+=v; c+=v*o.price(r.h)/1e4; peak=Math.max(peak,v); }); return {...o, mu:mwh/1000, cost:c, avg: mwh? c*1e4/mwh:0, peak}; });
  const defHours = best.rows.filter(r=>r.gap>0).map(r=>r.h);
  return {dem, sup, avail, dam, opts:OPTS, best, base, byOpt, defHours,
    peakDem:Math.max(...dem), peakGap:Math.max(0,...best.rows.map(r=>r.gap)), defMU:best.rows.reduce((a,r)=>a+Math.max(0,r.gap),0)/1000,
    surplusMU:best.rows.reduce((a,r)=>a+Math.max(0,-r.gap),0)/1000, bindingHrs:best.rows.filter(r=>r.binding).map(r=>r.h)};
}

// Q: Where is tomorrow short, and what fills the gap? (blockwise step chart)
function posChart(e, {h=300, sel=-1, purchases=true, action=null, labels=true}={}){
  const b=e.best, W=780, pad={l:46,r:labels?92:14,t:26,b:24}, iw=W-pad.l-pad.r, ih=h-pad.t-pad.b;
  const dem=e.dem, av=e.avail, cover=b.rows.map(r=>r.avail+(purchases?Object.values(r.alloc).reduce((a,v)=>a+v,0):0));
  const lo=Math.floor((Math.min(...dem,...av)-300)/500)*500, hi=Math.ceil((Math.max(...dem,...cover)+250)/500)*500;
  const x=t=>pad.l+t/24*iw, y=v=>pad.t+ih-(v-lo)/(hi-lo)*ih;
  const step=vals=>vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}L${x(i+1)},${y(v)}`).join('');
  const band=(lower,upper)=>{ let p=upper.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}L${x(i+1)},${y(v)}`).join(''); for(let i=lower.length-1;i>=0;i--) p+=`L${x(i+1)},${y(lower[i])}L${x(i)},${y(lower[i])}`; return p+'Z'; };
  let g=`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FEE4E2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#B42318" stroke-width="1.6"/></pattern></defs>`;
  for(let v=lo; v<=hi; v+=500){ g+=`<line x1="${pad.l}" x2="${pad.l+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#EDEFF2"/>${(v%1000===0)?`<text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${mw(v)}</text>`:''}`; }
  for(let t=0;t<=24;t+=3) g+=`<text x="${x(t)}" y="${h-6}" text-anchor="middle">${String(t).padStart(2,'0')}:00</text>`;
  if(sel>=0) g+=`<rect x="${x(sel)}" y="${pad.t}" width="${iw/24}" height="${ih}" fill="rgba(30,79,216,.07)"/>`;
  g+=`<path d="${band(av.map(()=>lo),av)}" fill="#EEF0F3"/>`;
  g+=`<path d="${band(dem.map((d,i)=>Math.min(d,av[i])),av)}" fill="var(--surplus)"/>`;
  if(purchases){ let cum=av.slice(); e.opts.forEach(o=>{ const add=b.rows.map(r=>r.alloc[o.id]||0); if(!add.some(v=>v)) return; const up=cum.map((c,i)=>c+add[i]); g+=`<path d="${band(cum,up)}" fill="${OPTC[o.id]}" opacity=".85"/>`; cum=up; });
    g+=`<path d="${band(cover,cover.map((c,i)=>Math.max(c,dem[i])))}" fill="url(#hatch)"/>`; }
  else g+=`<path d="${band(av,av.map((a,i)=>Math.max(a,dem[i])))}" fill="url(#hatch)"/>`;
  g+=`<path d="${step(av)}" fill="none" stroke="var(--supply-l)" stroke-width="1.5"/>`;
  g+=`<path d="${step(dem)}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  const gi=b.rows.reduce((m,r,i)=>r.gap>b.rows[m].gap?i:m,0), gv=b.rows[gi].gap;
  if(gv>0){ const cx=x(gi)+iw/48; g+=`<line x1="${cx}" x2="${cx}" y1="${y(dem[gi])}" y2="${y(av[gi])}" stroke="var(--bad)" stroke-width="1.5" marker-start="" /><line x1="${cx-5}" x2="${cx+5}" y1="${y(dem[gi])}" y2="${y(dem[gi])}" stroke="var(--bad)" stroke-width="1.5"/><line x1="${cx-5}" x2="${cx+5}" y1="${y(av[gi])}" y2="${y(av[gi])}" stroke="var(--bad)" stroke-width="1.5"/><rect x="${cx-96}" y="${(y(dem[gi])+y(av[gi]))/2-9}" width="86" height="18" rx="3" fill="#fff" stroke="var(--bad)"/><text x="${cx-53}" y="${(y(dem[gi])+y(av[gi]))/2+4}" text-anchor="middle" style="fill:var(--bad);font-weight:600">${mw(gv)} MW short</text>`; }
  if(labels){ g+=`<text x="${pad.l+iw+6}" y="${y(dem[23])+4}" style="fill:var(--ink);font-weight:600">Demand</text><text x="${pad.l+iw+6}" y="${y(av[23])+(Math.abs(y(av[23])-y(dem[23]))<14?16:4)}">Contracted</text>`; }
  b.rows.forEach((r,i)=>{ const L=[`${hrLabel(i)}–${hrLabel((i+1)%24)}`,`Demand  ${mw(r.dem)} MW`,`Contracted  ${mw(r.avail)} MW`, r.gap>0?`Short  ${mw(r.gap)} MW`:`Surplus  ${mw(-r.gap)} MW`]; if(purchases) Object.entries(r.alloc).forEach(([k,v])=>L.push(`+ ${e.opts.find(o=>o.id===k).short}  ${mw(v)} MW`)); if(r.unmet) L.push(`Unserved  ${mw(r.unmet)} MW`); g+=`<rect class="hit" x="${x(i)}" y="${pad.t}" width="${iw/24}" height="${ih}" ${tipAttr(L)} ${action?`data-action="${action}" data-id="${i}"`:''}/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Hourly demand against contracted supply">${g}</svg>`;
}

function waterfall(i){

  bar(0,lo,bt,'#9AA3AF','Supplier bill',money(bt),true);

  g+=`<line x1="${pad.l+(n-2)*bw+bw*.8}" x2="${pad.l+(n-1)*bw+bw*.2}" y1="${y(cur)}" y2="${y(cur)}" stroke="#9AA3AF" stroke-dasharray="2 2"/>`;
  bar(n-1,lo,st,'var(--accent)','Payable (system)',money(st),true);

  const W=1040, cx=[0,380,760], nw=[240,250,220], nh=44, gap=10, top=28, pos={};
  LIN.src.forEach((s,i)=>pos[s[0]]={x:cx[0],y:top+i*(nh+gap),w:nw[0]}); LIN.ent.forEach((s,i)=>pos[s[0]]={x:cx[1],y:top+i*(nh+gap),w:nw[1]}); LIN.app.forEach((s,i)=>pos[s[0]]={x:cx[2],y:top+(i+1.5)*(nh+gap),w:nw[2]});
  const H=top+8*(nh+gap), tr=S.linTrace&&S.linTrace!=='none'?LIN.tr[S.linTrace]:null, sel=S.linSel;
  let hot=null;
  if(tr) hot=new Set(tr.n); else if(sel){ hot=new Set([sel]); const en=LIN.ent.find(x=>x[0]===sel), sr=LIN.src.find(x=>x[0]===sel), ap=LIN.app.find(x=>x[0]===sel);
    if(en){ en[3].forEach(v=>hot.add(v)); LIN.use[sel].forEach(v=>hot.add(v)); }
    if(sr){ const e2=LIN.ent.find(x=>x[3].includes(sel)); hot.add(e2[0]); LIN.use[e2[0]].forEach(v=>hot.add(v)); }
    if(ap) Object.entries(LIN.use).forEach(([k,v])=>{ if(v.includes(sel)){ hot.add(k); LIN.ent.find(x=>x[0]===k)[3].forEach(z=>hot.add(z)); } }); }
  const edge=(a,b,err)=>{ const p=pos[a],q=pos[b],x1=p.x+p.w,y1=p.y+nh/2,x2=q.x,y2=q.y+nh/2,m=(x1+x2)/2; return `<path class="e ${err?'err':hot&&hot.has(a)&&hot.has(b)?'hot':hot?'dim':''}" d="M${x1},${y1}C${m},${y1} ${m},${y2} ${x2},${y2}"/>`; };
  let g='';
  LIN.ent.forEach(en=>{ en[3].forEach(s=>g+=edge(s,en[0],S.connectors.find(c=>c.id===s).status==='err')); LIN.use[en[0]].forEach(a=>g+=edge(en[0],a)); });
  const node=(id,t1,t2,dot)=>{ const p=pos[id]; return `<g class="n ${sel===id&&!tr?'on':''} ${hot&&!hot.has(id)?'dim':''}" data-action="lin-node" data-id="${id}" tabindex="0" role="button" aria-label="${esc(t1)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${nh}" rx="4"/>${dot?`<circle cx="${p.x+14}" cy="${p.y+nh/2}" r="4" fill="${dot}"/>`:''}<text class="t1" x="${p.x+(dot?26:12)}" y="${p.y+19}">${esc(t1)}</text><text class="t2" x="${p.x+(dot?26:12)}" y="${p.y+34}">${esc(t2)}</text></g>`; };
  LIN.src.forEach(s=>{ const c=S.connectors.find(z=>z.id===s[0]); g+=node(s[0],s[1],s[2],c.status==='ok'?'#2E9E62':c.status==='warn'?'#E09A2C':'#B42318'); });
  LIN.ent.forEach(en=>g+=node(en[0],en[1],`${en[2]} · ${en[4]}% valid`));
  LIN.app.forEach(a=>g+=node(a[0],a[1],'reads verified layer'));
  g+=`<text class="colh" x="0" y="14">SOURCE SYSTEMS</text><text class="colh" x="${cx[1]}" y="14">VERIFIED DATA LAYER</text><text class="colh" x="${cx[2]}" y="14">APPLICATIONS</text>`;
  let info='';
  if(!tr && sel){ const sr=LIN.src.find(x=>x[0]===sel), en=LIN.ent.find(x=>x[0]===sel), ap=LIN.app.find(x=>x[0]===sel);
    const ex={'e-inv':'INV-KCP-2609 → PPA-KCP §4.2 → SLDC schedule 25.19 MU → meter 25.97 MU','e-con':'PPA-SSP: Original to 31 Oct 2026, Amendment 1 from 1 Nov 2026','e-sch':'16 Oct, block 77 (19:00–19:15): Brahmani Thermal 1,188 MW','e-met':'Meter ECW-02, 12 Sep: blocks 37–40 missing','e-reg':'NOTICE-FPA effective 1 Oct 2026, affects BTPC and BPL energy charge','e-mkt':'DAM 16 Oct 19:00 indicative ₹10.00/kWh','e-rea':'REA week 39: Central Station A 1,612.0 MU','e-pay':'INV-BTPC-2608 paid 8 Sep with 1.5% rebate'};
    if(sr){ const c=S.connectors.find(z=>z.id===sel); info=`<dl class="kv"><dt>Source</dt><dd>${esc(c.name)}</dd><dt>Method</dt><dd>${c.kind}</dd><dt>Frequency</dt><dd>${c.freq}</dd><dt>Last sync</dt><dd>${c.last}</dd><dt>Coverage</dt><dd>${c.recs}</dd><dt>Status</dt><dd><span class="st ${c.status==='ok'?'good':c.status==='warn'?'warn':'bad'}">${c.status==='ok'?'Current':c.note}</span></dd></dl>${c.status==='err'?`<div style="margin-top:10px"><button class="btn sm pri" data-action="reconnect" data-id="${c.id}">Reconnect</button></div>`:''}`; }
    if(en) info=`<dl class="kv"><dt>Entity</dt><dd>${en[1]}</dd><dt>Records</dt><dd>${en[2]}</dd><dt>Passing validation</dt><dd>${en[4]}%</dd><dt>Fed by</dt><dd>${en[3].map(s=>LIN.src.find(x=>x[0]===s)[1]).join(', ')}</dd><dt>Used by</dt><dd>${LIN.use[sel].map(a=>LIN.app.find(x=>x[0]===a)[1]).join(', ')}</dd></dl><div class="small muted" style="margin:10px 0 4px">Example linked record</div><div class="mono" style="font-size:12px">${esc(ex[sel])}</div>`;
    if(ap) info=`<dl class="kv"><dt>Application</dt><dd>${ap[1]}</dd><dt>Reads</dt><dd>${Object.entries(LIN.use).filter(([k,v])=>v.includes(sel)).map(([k])=>LIN.ent.find(x=>x[0]===k)[1]).join(', ')}</dd></dl><div style="margin-top:10px"><button class="btn sm" data-action="go" data-nav="${ap[2]}">Open ${ap[1]}</button></div>`; }
  return `<div class="ph" style="border-top:0"><div class="bar"><span class="muted small">Trace</span><div class="seg">${[['none','Explore'],['kcp','INV-KCP-2609'],['ssp','INV-SSP-2609'],['plan',"Tomorrow's plan"]].map(([k,l])=>`<button data-action="lin-trace" data-id="${k}" aria-pressed="${(S.linTrace||'none')===k}">${l}</button>`).join('')}</div></div><span class="note">Click any box to follow its data</span></div>
    <div class="cols" style="padding:14px"><div class="linw"><svg class="lin" viewBox="0 0 ${W} ${H}" role="img" aria-label="Data lineage">${g}</svg></div><div style="max-width:620px">${tr?`<div class="callout info"><b>${tr.l}.</b> ${tr.t}</div>`:info||'<div class="muted">Select a box.</div>'}</div></div>`;
}

const GLOSS={MW:'Megawatt: how much power is flowing at one moment.',MU:'Million units (million kWh): an amount of energy over a period. 1,000 MW for one hour is 1 MU.',LPS:'Late Payment Surcharge: interest charged when a bill is paid after its due date (45 days after it is presented).',PAF:'Plant Availability Factor: the share of the month a power plant was ready to generate.',NAPAF:'Normative availability: the PAF a plant must reach to earn its full fixed charge.',DSM:'Deviation Settlement Mechanism: charges for drawing more or less power than scheduled.',DAM:'Day-Ahead Market: the power exchange where tomorrow\'s electricity is bought hour by hour.',RTM:'Real-Time Market: exchange trading close to delivery; prices are less predictable.',OTC:'Over-the-counter: a direct deal with a seller at a fixed price, here a block for 17:00–23:00.',JMR:'Joint Meter Reading: the meter reading signed by buyer and seller; the figure that is billed.',SLDC:'State Load Despatch Centre: the grid operator that schedules power every 15 minutes.',REA:'Regional Energy Account: monthly statement of energy scheduled from central power stations.',PPA:'Power Purchase Agreement: the contract that sets the price and billing rules with a supplier.',EPM:'Energy Portfolio Management: deciding what power to buy, when, and at what cost.',ABT:'Availability-Based Tariff meters record energy in 15-minute blocks.',ECR:'Energy Charge Rate: the price per unit of energy in a two-part tariff.',rebate:'Discount for paying early: 1.5% if paid within 5 days of the bill, 1% within 30 days.'};
function glossWrap(root){
  const seen=new Set(), keys=Object.keys(GLOSS), re=new RegExp('\\b('+keys.filter(k=>k!=='rebate').join('|')+'|[Rr]ebate)\\b');
  const skip=n=>n.closest('svg,button,select,option,textarea,input,abbr,.mono,.id,.tag,.ref,.paper,.chip,.st,.flag,th,.legend,.steps,label');
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&!skip(n.parentElement)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){ if(seen.size>=keys.length) break; const m=n.nodeValue.match(re); if(!m) continue; const k=/^[Rr]ebate$/.test(m[1])?'rebate':m[1]; if(seen.has(k)) continue; seen.add(k);
    const after=n.splitText(m.index); after.nodeValue=after.nodeValue.slice(m[1].length); const ab=document.createElement('abbr'); ab.className='term'; ab.setAttribute('data-tip',GLOSS[k]); ab.textContent=m[1]; n.parentNode.insertBefore(ab,after); }
}

function render(keep){
  const y=window.scrollY; S.did=S.did||{}; S.did['v_'+route]=true; if(S.guideOpen===undefined) S.guideOpen=innerWidth>=1280;
  $('#roleSel').value=S.role; $('#avatar').textContent=ROLE[S.role].ini; hideTip(); renderNav();
  $('#view').innerHTML=VIEWS[route]();
  const ph=$('#view .phead')||$('#view .crumbs'); if(ph&&S.tips!==false) ph.insertAdjacentHTML('afterend',guideStrip(route));
  glossWrap($('#view')); renderDrawer();
  const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight;
  if(keep) window.scrollTo(0,y); else window.scrollTo(0,0);
}
function go(nav){
  if(nav.startsWith('bill:')){ S.selInv=nav.slice(5); S.billTab='recon'; route='bill'; }
  else if(nav.startsWith('doc:')){ S.libSel=nav.slice(4); route='library'; }
  else if(nav.startsWith('data:')){ S.dataTab=nav.slice(5); route='data'; }
  else if(nav==='portfolio-year'){ S.horizon='year'; route='portfolio'; }
  else if(nav==='regack'){ regAck(); route='library'; }
  else route=nav;
  try{ history.replaceState(null,'','#'+(route==='bill'?'billing':route)); }catch(e){}
  save(); render();
}
function regAck(){ if(S.regAck) return; S.regAck=true; log('Raised billing rule change for fuel cost adjustment notice (BTPC, BPL, Oct 2026 bills onward)','NOTICE-FPA'); toast('Billing rule change raised'); }
const tip=$('#tip');
function hideTip(){ tip.classList.remove('on'); }
document.addEventListener('mouseover',ev=>{ const t=ev.target.closest('[data-tip]'); if(t){ tip.textContent=t.getAttribute('data-tip'); tip.classList.add('on'); } else hideTip();
  const f=ev.target.closest('[data-f]'); document.querySelectorAll('.fx.hi').forEach(n=>n.classList.remove('hi')); if(f) document.querySelectorAll(`.fx[data-f="${f.dataset.f}"]`).forEach(n=>n.classList.add('hi')); });
document.addEventListener('mousemove',ev=>{ if(!tip.classList.contains('on')) return; const w=tip.offsetWidth,h=tip.offsetHeight; let x=ev.clientX+12,y=ev.clientY+12; if(x+w>innerWidth-8) x=ev.clientX-w-12; if(y+h>innerHeight-8) y=ev.clientY-h-12; tip.style.left=x+'px'; tip.style.top=y+'px'; });
document.addEventListener('scroll',hideTip,true);
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-action]'); if(!el) return; const a=el.dataset.action, id=el.dataset.id;
  switch(a){
    case 'guide': S.guideOpen=!S.guideOpen; save(); renderDrawer(); break;
    case 'tips': S.tips=el.checked; save(); render(true); break;
    case 'gstep': { const d=DEMO[+id]; const r=typeof d.role==='function'?d.role():d.role; if(r&&r!==S.role){ S.role=r; toast(`Signed in as ${ROLE[r].name}, ${ROLENAME[r]}`); } go(d.go); break; }
    case 'role': S.role=id; save(); render(true); toast(`Signed in as ${ROLE[id].name}, ${ROLENAME[id]}`); break;
    case 'heatwave': S.scen={...S.scen,demand:6,price:30}; S.horizon='day'; save(); render(true); toast('Heatwave: demand +6%, exchange price +30%. Press Save scenario to keep it.'); break;
    case 'libpick': S.libSel=el.dataset.doc; S.libDate=el.dataset.date; S.did.lib=true; route='library'; save(); render(true); break;
    case 'go': go(el.dataset.nav); break;
    case 'reset': { const go2=S.guideOpen; S=seedState(); S.billTab='recon'; S.dataTab='lineage'; S.evSel=-1; S.guideOpen=go2; save(); route='overview'; render(); toast('Demo data reset'); break; }
    case 'dtab': S.dataTab=id; save(); render(true); break;
    case 'btab': S.billTab=id; if(id==='doc') S.did.doc=true; save(); render(true); break;
    case 'sup': S.supSel=S.supSel===id?null:id; render(true); break;
    case 'cost-month': S.costSel=+id; save(); render(true); break;
    case 'epm-hour': S.epmHour=+id; S.did.hour=true; if(route!=='portfolio'){route='portfolio';} S.horizon='day'; save(); render(true); break;
    case 'lin-node': S.linSel=id; S.linTrace='none'; save(); render(true); break;
    case 'lin-trace': S.linTrace=id; S.dataTab='lineage'; if(id!=='none') S.did.trace=true; route='data'; save(); render(true); break;
    case 'ev': S.evSel=+id; save(); render(true); break;
    case 'reconnect': { const c=S.connectors.find(x=>x.id===id); c.status='ok'; c.last='15 Oct '+stamp().slice(11); c.note=''; c.recs='Sep payments: 214 entries'; S.imports.unshift([`15 Oct ${stamp().slice(11)}`,'Payments ledger','214 entries','Loaded']); log(`Reconnected ${c.name}`,'DATA'); save(); render(true); toast('Payments ledger reconnected, 214 entries loaded'); break; }
    case 'resolve': { const v=S.issues.find(x=>x.id===id); S.issues=S.issues.filter(x=>x.id!==id); log(`Resolved ${id}: ${v.fix}`,'DATA'); save(); render(true); toast(`${id} resolved`); break; }
    case 'ingest': openIngest(); break;
    case 'bfilter': S.billFilter=id; save(); render(true); break;
    case 'maker': makerAct(id,el.dataset.d); break;
    case 'checker': { const i=S.invoices.find(x=>x.id===id); if(el.dataset.d==='approve'){ i.status='approved'; i.approvedAmt=+payable(i).toFixed(2); log(`Approved ${money(i.approvedAmt)} for payment`,id); toast(`${id} approved`); } else { i.status=isMatch(i)?'reconciled':'discrepancy'; delete i.decision; log('Sent back to maker',id); toast(`${id} sent back`); } save(); render(true); break; }
    case 'pay': { const i=S.invoices.find(x=>x.id===id); i.status='paid'; i.paidOn=TODAY; const r=rebateNow(i,TODAY); log(`Payment of ${money(payable(i))} released; rebate ${r.pct}% (${money(payable(i)*r.pct/100)})`,id); save(); render(true); toast(r.pct?`Paid. Rebate kept: ${money(payable(i)*r.pct/100)}`:'Paid before due date, no LPS'); break; }
    case 'corrected': { const i=S.invoices.find(x=>x.id===id); i.lines.forEach(l=>l.billed=l.sys); i.qty.billedMU=i.qtyCheck==='jmr'?i.qty.jmrMU:i.qtyCheck==='meter'?i.qty.meterMU:i.qty.schedMU; i.presented=TODAY; i.status='reconciled'; i.reason='Corrected bill agrees with the recalculation.'; log('Corrected bill received; matched',id); save(); render(true); toast('Corrected bill matched; rebate clock restarted'); break; }
    case 'horizon': S.horizon=id; save(); render(true); break;
    case 'save-scen': { const e=epmRun(S.scen), sc=S.scen; const name=[sc.demand?`Demand ${sc.demand>0?'+':''}${sc.demand}%`:'',sc.price?`Price ${sc.price>0?'+':''}${sc.price}%`:'',sc.hydro!==100?`Hydro ${sc.hydro}%`:'',sc.outage?'Unit outage':''].filter(Boolean).join(', ')||'Base case'; S.saved.push({name,gap:e.peakGap,mu:e.byOpt.reduce((a,o)=>a+o.mu,0),cost:e.best.cost,unmet:e.best.unmet/1000}); save(); render(true); toast(`Saved: ${name}`); break; }
    case 'del-scen': S.saved.splice(+id,1); save(); render(true); break;
    case 'reset-scen': S.scen={demand:0,price:0,hydro:100,outage:false,sell:true}; save(); render(true); break;
    case 'epm-submit': { const e=epmRun(S.scen); const p={id:'PLAN-'+(1016+S.proposals.length),status:'pending',mu:e.byOpt.reduce((a,o)=>a+o.mu,0),cost:e.best.cost,by:ROLE[S.role].name}; S.proposals=S.proposals.filter(x=>x.status!=='pending'); S.proposals.push(p); log(`Submitted ${p.id} for ${fmtD(TOMORROW)}: ${p.mu.toFixed(2)} MU, ${money(p.cost)}`,p.id); save(); render(true); toast(`${p.id} sent to Director (Commercial)`); break; }
    case 'epm-approve': { const p=S.proposals.find(x=>x.status==='pending'); p.status='approved'; p.by=ROLE.director.name; log(`Approved ${p.id}; bids to be placed before 12:00`,p.id); save(); render(true); toast(`${p.id} approved`); break; }
    case 'epm-reject': { const p=S.proposals.find(x=>x.status==='pending'); p.status='returned'; log(`Returned ${p.id} for revision`,p.id); save(); render(true); toast(`${p.id} returned`); break; }
    case 'open-doc': { const keep=el.dataset.keep; S.libSel=el.dataset.doc; route='library'; try{history.replaceState(null,'','#library');}catch(e){} save(); render(!!keep); break; }
    case 'reg-ack': regAck(); save(); render(true); break;
    case 'ask': route='assistant'; try{history.replaceState(null,'','#assistant');}catch(e){} ask(el.dataset.q); render(); break;
    case 'tfilter': S.taskFilter=id; save(); render(true); break;
    case 'close-modal': $('#modalRoot').innerHTML=''; break;
    case 'close-bg': if(ev.target===el) $('#modalRoot').innerHTML=''; break;
    case 'open-ingested': $('#modalRoot').innerHTML=''; go('bill:'+id); break;
  }
});
function makerAct(id,d){
  const i=S.invoices.find(x=>x.id===id), note=($('#mNote')||{}).value||'';
  if(d==='supplier'&&!note.trim()){ toast('Add a note explaining why the supplier figure is accepted'); $('#mNote').focus(); return; }
  if(d==='return'){ i.status='returned'; i.returnedOn=TODAY; log(`Returned to supplier (${money(diffOf(i))} in question)${note?': '+note:''}`,id); toast(`${id} returned to supplier`); }
  else { i.decision=d; i.makerNote=note; i.status='maker_ok'; log(d==='system'?`Verified ${money(sysTotal(i))}${Math.abs(diffOf(i))>0.004?`; dispute raised for ${money(diffOf(i))}`:''}${note?': '+note:''}`:`Accepted supplier figure ${money(billedTotal(i))}: ${note}`,id); toast(`${id} sent to checker`); }
  save(); render(true);
}
document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.dataset.scen&&t.type==='range'){ S.scen[t.dataset.scen]=+t.value; save(); const id=t.id; render(true); const n=document.getElementById(id); if(n) n.focus(); }
  if(t.id==='libQ'){ S.libQ=t.value; const p=t.selectionStart; render(true); const n=$('#libQ'); n.focus(); n.setSelectionRange(p,p); } });
document.addEventListener('change',ev=>{ const t=ev.target;
  if(t.dataset.scen&&t.type==='checkbox'){ S.scen[t.dataset.scen]=t.checked; save(); render(true); }
  if(t.id==='libT'){ S.libType=t.value; render(true); }
  if(t.id==='libD'&&t.value){ S.libDate=t.value; S.did.lib=true; save(); render(true); }
  if(t.id==='roleSel'){ S.role=t.value; save(); render(true); toast(`Signed in as ${ROLE[S.role].name}, ${ROLENAME[S.role]}`); } });
document.addEventListener('submit',ev=>{ ev.preventDefault();
  if(ev.target.id==='chatForm'){ const v=$('#chatIn').value.trim(); if(!v) return; ask(v); render(true); $('#chatIn').focus(); }
  if(ev.target.id==='topAsk'){ const inp=$('#topAskIn'), v=inp.value.trim(); if(!v) return; inp.value=''; inp.blur(); route='assistant'; try{history.replaceState(null,'','#assistant');}catch(e){} if(!S.chat) S.chat=[]; ask(v); render(); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('n')) ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); if(ev.key==='Escape') $('#modalRoot').innerHTML=''; if(ev.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ ev.preventDefault(); $('#topAskIn').focus(); } });

function openIngest(){
  const i=S.invoices.find(x=>x.status==='inbox'); if(!i){ toast('Inbox is empty'); return; }
  const s=SUP[i.sup], bt=billedTotal(i), st=sysTotal(i);
  const steps=[['Received','Email, 14 Oct 19:42 · Sep26_bill.pdf, 3 pages'],['Fields read',`${4+i.lines.length} fields, lowest confidence 96.5%`],['Matched to contract',`${s.docs.join(', ')} · FY 2026-27 version in force for ${i.period}`],['Supporting records',`Schedule ${i.qty.schedMU} MU · meter ${i.qty.meterMU} MU · PAF ${i.qty.paf}%`],['Recalculated',`Billed ${money(bt)} · calculated ${money(st)}`],['Result',`Discrepancy ${money(bt-st)}: transmission charges not billable (PPA-BPL §3.4)`]];
  $('#modalRoot').innerHTML=`<div class="mbg" data-action="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="Import bill"><div class="ph"><h2>Import bill · ${s.name}</h2><button class="btn sm" data-action="close-modal">Close</button></div><div class="pipe">${steps.map(([t,b],k)=>`<div class="pstep" id="ps${k}"><span class="d">✓</span><div><b style="font-weight:500">${t}</b><div class="small muted">${b}</div></div><span class="small faint">${k===0?'19:42':''}</span></div>`).join('')}</div><div class="ph" style="border-top:1px solid var(--line2);border-bottom:0"><span class="muted small">Routed to Billing Officer for verification</span><button class="btn pri sm" id="ingestDone" disabled data-action="open-ingested" data-id="${i.id}">Open ${i.id}</button></div></div></div>`;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  steps.forEach((_,k)=>setTimeout(()=>{ const n=document.getElementById('ps'+k); if(n) n.classList.add('on'); if(k===steps.length-1){ const dn=$('#ingestDone'); if(dn) dn.disabled=false; } }, reduce?0:350*k+150));
  i.status='discrepancy'; const c=S.connectors.find(x=>x.id==='inbox'); c.recs='No new bills'; c.last='15 Oct '+stamp().slice(11);
  S.imports=S.imports.map(r=>r[1]==='Invoice inbox'&&r[3].startsWith('Waiting')?[r[0],r[1],r[2],'Loaded']:r);
  S.audit.unshift([stamp(),'System',`${i.id} imported and reconciled: ${money(bt-st)} difference flagged`,i.id]);
  save(); render(true);
}

(function(){
  const h=(location.hash||'').slice(1); if(VIEWS[h]&&h!=='bill') route=h;
  const tick=()=>{ const d=nowSim(); $('#clock').textContent=`${fmtD(TODAY)}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} IST`; };
  tick(); setInterval(tick,20000);
  window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(VIEWS[h]&&h!==route&&!(h==='billing'&&route==='bill')){ route=h; render(); } });
  render();
})();
</script>
